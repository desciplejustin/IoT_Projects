; IoT_Projects workspace container
;
; This repository stores multiple independent PlatformIO projects.
; Build and upload from the individual project folders, for example:
;   pio -d Project1 run
;   pio -d Project3-ColdRoom-TempMonitor run -e esp32dev_app
;
; The root folder is not a deployable firmware target.

[platformio]
description = Multi-project IoT firmware workspace
