[platformio]
default_envs = uvind_app
; Shared standard credentials (gitignored single source of truth).
extra_configs = ..\shared_libs\bbh_secrets.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; This bench has several USB-serial boards. This ESP32 WROOM-32 is a Silicon Labs
; CP210x (VID:PID 10C4:EA60) enumerated as COM12. NOTE: the Project5 NodeMCU is
; ALSO a CP210x (10C4:EA60), so a bare hwgrep://10C4:EA60 could grab the wrong
; board — keep an explicit COM port here. If Windows renumbers it, rescan
; (Get-CimInstance Win32_PnPEntity | ? { $_.Name -match 'COM' }) and update this.
upload_port = COM12
monitor_port = COM12
lib_extra_dirs = ..\shared_libs
board_build.filesystem = littlefs

; Output self-test: cycles each relay, pulses each buzzer, blinks the LEDs so an
; installer can verify wiring/polarity BEFORE onboarding. Standalone (no core), so
; ignore the core or PlatformIO would try to compile it (and its deps) for this env.
[env:uvind_selftest]
extends = env
build_flags =
  -D SELFTEST_ONLY=1
lib_ignore = BBHIotFirmwareCore

; Full firmware. Standard creds come from ${bbh_secrets.build_flags}; only the
; non-secret broker location / topics are set per project here. Switch dev<->live
; by changing BBH_BOOTSTRAP_BROKER_HOST (or just set the IP in the setup portal).
[env:uvind_app]
extends = env
build_flags =
  ${bbh_secrets.build_flags}
  -D SELFTEST_ONLY=0
  ; WiFi boost: max TX power + modem sleep off. This is a mains-powered device,
  ; so keep the link strong/steady.
  -D BBH_WIFI_HIGH_PERFORMANCE=1
  ; Dev broker = WSL2 Mosquitto behind the Windows host LAN IP. DHCP-volatile;
  ; the setup portal's broker-IP field overrides this at runtime. Point it at the
  ; host's CURRENT 10.24.16.x address when rebuilding a fresh dev device.
  -D BBH_BOOTSTRAP_BROKER_HOST=\"10.24.16.105\"
  -D BBH_BOOTSTRAP_BROKER_PORT=1883
  -D BBH_BOOTSTRAP_CLAIM_TOPIC=\"bbh/iot/bootstrap/claim\"
  -D BBH_BOOTSTRAP_REPLY_PREFIX=\"bbh/iot/bootstrap/reply\"
lib_deps =
  bblanchon/ArduinoJson @ ^7
  256dpi/MQTT @ ^2.5.2
  tzapu/WiFiManager @ ^2.0.17
