[platformio]
default_envs = uvmon_app
; Shared standard credentials (gitignored single source of truth).
extra_configs = ..\shared_libs\bbh_secrets.ini

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; This bench has several USB-serial boards. This NodeMCU is a Silicon Labs
; CP210x (VID:PID 10C4:EA60) and enumerated as COM3. If Windows renumbers it,
; switch these to: upload_port = hwgrep://10C4:EA60  (same for monitor_port).
upload_port = COM3
monitor_port = COM3
lib_extra_dirs = ..\shared_libs
board_build.filesystem = littlefs

; Wiring-verification helper: prints each contactor input's live raw + debounced
; state so you can confirm channel mapping and polarity before onboarding.
[env:uvmon_scan]
extends = env
build_flags =
  -D SENSOR_ID_SCAN_ONLY=1
; Scan mode is a standalone wiring check and does not use the shared core; ignore
; it so PlatformIO doesn't compile the core (and demand its deps) for this env.
lib_ignore = BBHIotFirmwareCore

; Full firmware. Standard creds come from ${bbh_secrets.build_flags}; only the
; broker location / topics (non-secret) are set per project here. Switch dev<->live
; by changing BBH_BOOTSTRAP_BROKER_HOST (or just set the IP in the setup portal).
[env:uvmon_app]
extends = env
build_flags =
  ${bbh_secrets.build_flags}
  -D SENSOR_ID_SCAN_ONLY=0
  ; WiFi boost: max TX power + modem sleep off. This is a mains-powered device,
  ; so keep the link strong/steady. Omit for battery builds.
  -D BBH_WIFI_HIGH_PERFORMANCE=1
  ; Dev broker = WSL2 Mosquitto behind the Windows host LAN IP. DHCP-volatile;
  ; the setup portal's broker-IP field overrides this at runtime. Point it at the
  ; host's CURRENT 10.24.16.x address when rebuilding a fresh dev device.
  -D BBH_BOOTSTRAP_BROKER_HOST=\"10.24.16.105\"
  -D BBH_BOOTSTRAP_BROKER_PORT=1883
  -D BBH_BOOTSTRAP_CLAIM_TOPIC=\"bbh/iot/bootstrap/claim\"
  -D BBH_BOOTSTRAP_REPLY_PREFIX=\"bbh/iot/bootstrap/reply\"
lib_deps =
  bblanchon/ArduinoJson @ ^7
  256dpi/MQTT @ ^2.5.2
  tzapu/WiFiManager @ ^2.0.17
