[platformio]
default_envs = c3_app
; Shared standard credentials (gitignored single source of truth).
extra_configs = ..\shared_libs\bbh_secrets.ini

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; This PC has two USB-serial boards (a CH340 on COM4 and this C3 on COM10).
; Pin the C3 so PlatformIO never auto-detects the wrong board. The C3's native
; USB is VID:PID 303A:1001 — if Windows ever renumbers it off COM10, switch these
; to: upload_port = hwgrep://303A:1001  (same for monitor_port).
upload_port = COM10
monitor_port = COM10
lib_extra_dirs = ..\shared_libs
board_build.filesystem = littlefs

; Sensor-ID scan helper: lists any DS18B20 ROM codes on the bus.
[env:c3_scan]
extends = env
build_flags =
  -D SENSOR_ID_SCAN_ONLY=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4

; Full firmware. Standard creds come from ${bbh_secrets.build_flags}; only the
; broker location / topics (non-secret) are set per project here. Switch dev<->live
; by changing BBH_BOOTSTRAP_BROKER_HOST (or just set the IP in the setup portal).
[env:c3_app]
extends = env
build_flags =
  ${bbh_secrets.build_flags}
  -D SENSOR_ID_SCAN_ONLY=0
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; WiFi boost: max TX power + modem sleep off. Stronger/steadier link at the
  ; cost of higher idle current. Fine for this mains-powered bench device; leave
  ; OFF (omit this flag) for battery-powered builds.
  -D BBH_WIFI_HIGH_PERFORMANCE=1
  ; Dev broker = WSL2 Mosquitto behind the Windows host LAN IP. This is
  ; DHCP-volatile (it moved off .94, which caused a dead portproxy); the setup
  ; portal's broker-IP field overrides this at runtime. Point it at the host's
  ; CURRENT 10.24.16.x address when rebuilding a fresh dev device.
  -D BBH_BOOTSTRAP_BROKER_HOST=\"10.24.16.105\"
  -D BBH_BOOTSTRAP_BROKER_PORT=1883
  -D BBH_BOOTSTRAP_CLAIM_TOPIC=\"bbh/iot/bootstrap/claim\"
  -D BBH_BOOTSTRAP_REPLY_PREFIX=\"bbh/iot/bootstrap/reply\"
lib_deps =
  bblanchon/ArduinoJson @ ^7
  256dpi/MQTT @ ^2.5.2
  tzapu/WiFiManager @ ^2.0.17
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
